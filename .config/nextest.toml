# cargo-nextest configuration. Run with `cargo t` (alias for `cargo nextest run`).
# NOTE: nextest does not run doctests; use `cargo test --doc` (scripts/check.sh does).

[profile.default]
# Show everything that failed, again, at the end of the run.
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"
# An agent loop that never terminates is a bug: flag slow tests at 5s, kill at 15s.
slow-timeout = { period = "5s", terminate-after = 3 }

[profile.ci]
# Run every test even after a failure so one CI run reports everything.
fail-fast = false
retries = 0
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "5s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"

# A JavaScript or Python plugin is a 12 to 18 MB engine that takes several seconds to compile
# the first time a machine sees it (later loads come from the disk cache in well under one).
[[profile.default.overrides]]
filter = 'binary(guest_languages)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'binary(guest_languages)'
slow-timeout = { period = "30s", terminate-after = 3 }

# PowerShell takes a second or more to start, and the kernel's tests start it more than once.
[[profile.default.overrides]]
filter = 'test(/powershell/)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(/powershell/)'
slow-timeout = { period = "30s", terminate-after = 3 }

# `cargo eval`: the ignored tests in tests/local_model.rs, against a model served on this
# machine (scripts/local-model.sh). A small model on a CPU takes tens of seconds per task, and
# the server answers one request at a time well, so the evals run one by one.
[profile.eval]
failure-output = "final"
status-level = "pass"
final-status-level = "fail"
test-threads = 1
slow-timeout = { period = "60s", terminate-after = 5 }
