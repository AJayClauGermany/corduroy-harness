name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # Guest plugins in plugins/ compile to WebAssembly; the core also builds for a
          # microcontroller.
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The JavaScript and Python SDKs build the guest-language plugins the host tests load.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path plugins/Cargo.toml --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The core and the loop without the standard library, and the harness without its
      # default features.
      - run: cargo clippy -p corduroy-core --no-default-features --features critical-section --target thumbv7em-none-eabihf -- -D warnings
      - run: cargo clippy -p corduroy-harness --no-default-features --features critical-section --target thumbv7em-none-eabihf -- -D warnings
      - run: cargo clippy -p corduroy-harness --all-targets --no-default-features --features std -- -D warnings
      # The command on its own features, which the workspace's would otherwise hide.
      - run: cargo check -p corduroy-cli
      - run: cargo clippy --manifest-path plugins/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      # The host tests load the plugins, so they are built first.
      - run: cargo plugins
      - run: scripts/guests.sh
      # Fail rather than skip when a guest-language plugin or PowerShell (which the runner
      # has) is missing.
      - run: cargo nextest run --all-features --profile ci
        env:
          CORDUROY_REQUIRE_GUESTS: "1"
          CORDUROY_REQUIRE_POWERSHELL: "1"
      # The keychain against a real Secret Service: a D-Bus session and a keyring of its own,
      # unlocked. Fail rather than pass without one.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring
      - run: dbus-run-session -- bash -c 'echo -n test | gnome-keyring-daemon --unlock --components=secrets && sleep 1 && cargo nextest run -p corduroy-keychain --profile ci'
        env:
          CORDUROY_REQUIRE_KEYCHAIN: "1"
      - run: cargo test --manifest-path plugins/Cargo.toml
      # nextest does not run doctests.
      - run: cargo test --doc --all-features
      - run: cargo doc --no-deps --all-features

  windows:
    # The command, and its kernel, on Windows: the shell there is Windows PowerShell.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo build -p corduroy-cli
      - run: cargo clippy -p corduroy-core -p corduroy-jsonl -p corduroy-shell -p corduroy-keychain -p corduroy-std --all-targets -- -D warnings
      # The core, the event log's file, the PowerShell kernel and the keychain (the
      # Credential Manager, which must be there); the POSIX shell's tests need a POSIX system.
      - run: cargo nextest run -p corduroy-core -p corduroy-jsonl -p corduroy-shell -p corduroy-keychain --profile ci -E "package(corduroy-core) or package(corduroy-jsonl) or package(corduroy-keychain) or test(/powershell/)"
        env:
          CORDUROY_REQUIRE_POWERSHELL: "1"
          CORDUROY_REQUIRE_KEYCHAIN: "1"

  macos:
    # The keychain on macOS: the login Keychain, which must be there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo clippy -p corduroy-keychain --all-targets -- -D warnings
      - run: cargo nextest run -p corduroy-keychain --profile ci
        env:
          CORDUROY_REQUIRE_KEYCHAIN: "1"
