name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # Guest plugins in plugins/ compile to WebAssembly; the core also builds for a
          # microcontroller.
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The JavaScript and Python SDKs build the guest-language plugins the host tests load.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path plugins/Cargo.toml --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The core and the loop without the standard library, and the harness without its
      # default features.
      - run: cargo clippy -p corduroy-core --no-default-features --features critical-section --target thumbv7em-none-eabihf -- -D warnings
      - run: cargo clippy -p corduroy-harness --no-default-features --features critical-section --target thumbv7em-none-eabihf -- -D warnings
      - run: cargo clippy -p corduroy-harness --all-targets --no-default-features --features std -- -D warnings
      - run: cargo clippy --manifest-path plugins/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      # The host tests load the plugins, so they are built first.
      - run: cargo plugins
      - run: scripts/guests.sh
      # Fail rather than skip when a guest-language plugin is missing.
      - run: cargo nextest run --all-features --profile ci
        env:
          CORDUROY_REQUIRE_GUESTS: "1"
      - run: cargo test --manifest-path plugins/Cargo.toml
      # nextest does not run doctests.
      - run: cargo test --doc --all-features
      - run: cargo doc --no-deps --all-features
