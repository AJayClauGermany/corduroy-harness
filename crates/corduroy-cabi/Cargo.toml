[package]
name = "corduroy-cabi"
description = "A prototype: extensions for the corduroy harness written against a C interface."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[features]
default = []
# The loop's side of the interface: a model provider that answers through a completion.
harness = ["dep:corduroy-harness", "dep:async-trait", "dep:serde_json"]
# Compile the extension in `examples/c/` and link it in, for this crate's tests. Needs a C
# compiler, which nothing else in the workspace does.
c-example = ["dep:cc"]

[dependencies]
corduroy-core = { workspace = true, features = ["std"] }
corduroy-harness = { workspace = true, features = ["std", "tokio"], optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }

# The workspace's table, copied, with one difference: `unsafe_code` is `deny` here and
# `forbid` there. Cargo cannot inherit a table and change one entry of it, and `forbid`
# cannot be lifted by an attribute, so the one crate that crosses into C carries the table
# itself. `unsafe` is confined to `mod raw` (see `src/lib.rs`).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
redundant_imports = "warn"
explicit_outlives_requirements = "warn"
meta_variable_misuse = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }


[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"


[lints.clippy]
# Whole lint groups (lowest priority so the individual entries below win).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Hand-picked `restriction` lints. This group is never enabled wholesale because
# it contains contradictory lints; these are the ones that fit an agent harness.
# -- Failure handling: surface errors, never panic in library paths.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
exit = "warn"
# -- Output goes through the writer we are handed, not stray prints.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
use_debug = "warn"
# -- Explicitness.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
error_impl_error = "warn"
clone_on_ref_ptr = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_add = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
partial_pub_fields = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
renamed_function_params = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
