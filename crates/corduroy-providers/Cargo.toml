[package]
name = "corduroy-providers"
description = "Model providers for the corduroy harness, from oi-kit-providers: Anthropic, OpenAI, Ollama and the providers Goose knows."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
corduroy-harness = { workspace = true }
oi-kit-providers = { workspace = true }
oi-kit-provider-types = { workspace = true }
# The tool and result types oi-kit's providers take, at the version oi-kit uses.
rmcp = { workspace = true }
async-trait = { workspace = true }
# An answer is read from oi-kit as a stream, a piece at a time.
futures-core = { workspace = true }
# The one sign oi-kit's client gives of a retry it makes by itself is a line it logs.
tracing-core = { workspace = true }
anyhow = { workspace = true }
# A secret is revealed on the blocking pool of the runtime oi-kit's client already needs,
# and a request is bounded by its clock.
tokio = { workspace = true, features = ["time"] }
base64 = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
toml = { workspace = true }
