[package]
name = "corduroy-keychain"
description = "The operating system's keychain for the corduroy harness: a secret kept in the macOS Keychain, the Windows Credential Manager or the Secret Service, and never in a file or the environment."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
corduroy-core = { workspace = true, features = ["std"] }
# The one interface the three stores below are reached through.
keyring-core = "1.1.0"

# Each system's own store, and nothing for a system that has none.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.3", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

# The Secret Service over D-Bus, spoken in Rust: no system library to link.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
corduroy-test-support = { workspace = true }
