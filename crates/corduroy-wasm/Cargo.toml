[package]
name = "corduroy-wasm"
description = "Loads WebAssembly components as capability-gated corduroy plugins."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
corduroy-core = { workspace = true, features = ["std"] }
wasmtime = { workspace = true }
wit-component = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
corduroy-shell = { workspace = true }
corduroy-test-support = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
# Add-ons built against other versions of the world, made in the tests from its WIT.
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser = { workspace = true }
