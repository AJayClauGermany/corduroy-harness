[package]
name = "corduroy-cli"
description = "The corduroy command: an agent described by a file, run in a terminal."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "corduroy"
path = "src/main.rs"

[dependencies]
corduroy-harness = { workspace = true, features = ["wasm", "shell", "jsonl"] }
corduroy-http = { workspace = true }
corduroy-mcp = { workspace = true }
corduroy-providers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
toml = { workspace = true }

[dev-dependencies]
corduroy-test-support = { workspace = true }
