[workspace]
members = [".", "crates/*"]
# Without this, commands run at the root would cover the root package only.
default-members = [".", "crates/*"]
# Guest plugins compile to WebAssembly and live in their own workspace.
exclude = ["plugins"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSL-1.0"
repository = "https://github.com/AJayClauGermany/corduroy-harness"
readme = "README.md"
keywords = ["agent", "llm", "harness", "wasm", "plugins"]
categories = ["development-tools"]

[workspace.dependencies]
# Members pick the parts they use; the command takes them all.
corduroy-harness = { path = ".", version = "0.1.0", default-features = false }
# Without `std` unless a member asks for it, so the harness can be built for a device.
corduroy-core = { path = "crates/corduroy-core", version = "0.1.0", default-features = false }
corduroy-wasm = { path = "crates/corduroy-wasm", version = "0.1.0" }
corduroy-jsonl = { path = "crates/corduroy-jsonl", version = "0.1.0" }
corduroy-shell = { path = "crates/corduroy-shell", version = "0.1.0" }
corduroy-http = { path = "crates/corduroy-http", version = "0.1.0" }
corduroy-chatgpt = { path = "crates/corduroy-chatgpt", version = "0.1.0" }
corduroy-keychain = { path = "crates/corduroy-keychain", version = "0.1.0" }
corduroy-mcp = { path = "crates/corduroy-mcp", version = "0.1.0" }
corduroy-providers = { path = "crates/corduroy-providers", version = "0.1.0" }
corduroy-std = { path = "crates/corduroy-std", version = "0.1.0" }
corduroy-test-support = { path = "crates/corduroy-test-support", version = "0.1.0" }
# The core's lock when it is built without the standard library: the device supplies it.
critical-section = "1.2.0"
# Synchronous embedding: no async runtime, and no WASI, so plugins get no ambient authority.
wasmtime = { version = "51.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "cache", "parallel-compilation"] }
wit-component = "0.263.0"
# The same version, to read the world's WIT in the WebAssembly host's tests.
wit-parser = "0.263.0"
# The `random` capability. The version wasmtime's tree already carries.
getrandom = "0.3.4"
# Hashes of plugin components, for the compiled-code cache and `plugin/load`. The version
# wasmtime's cache already carries.
sha2 = "0.10.9"
oi-kit-provider-types = { version = "=0.1.0-alpha.15", default-features = false }
# Real model providers (HTTP clients for Anthropic, OpenAI, Ollama and others), for the
# `corduroy` command. Kept out of the harness library.
oi-kit-providers = { version = "=0.1.0-alpha.15", default-features = false, features = ["rustls-tls"] }
# Must match the versions oi-kit is built against: its API exposes these types.
rmcp = { version = "3.11.0", default-features = false }
# Images in tool results are bytes inside the harness and base64 in the log, in MCP and in
# what the model is sent. The version oi-kit and rmcp already carry.
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
anyhow = { version = "1", default-features = false }
# Sign in with ChatGPT: random values, SHA-256 and the RSA check of an ID token. The version
# the TLS stack already carries.
ring = "0.17.14"
# The HTTP client behind the `http` capability: blocking, so it fits a plugin's blocking call.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# Keys in the order they were written, so log payloads read naturally (`id` first).
serde_json = { version = "1", default-features = false, features = ["alloc", "preserve_order"] }
# The agent file of the `corduroy` command.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[package]
name = "corduroy-harness"
description = "A plugin-first agent harness: capability-gated WebAssembly plugins around a small core."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["tokio", "wasm"]
# The standard library. Without it the harness, like the core, needs only an allocator and
# runs on a microcontroller, with `critical-section` for its locks.
std = ["corduroy-core/std", "anyhow/std", "base64/std", "serde_json/std"]
# Tool calls run on tokio's blocking pool when the loop runs on a tokio runtime, so a long
# tool does not hold up the runtime's other tasks. Without it they run where the loop runs.
# The loop itself needs no particular executor.
tokio = ["std", "dep:tokio"]
# The lock of a harness built without `std`, from whatever implementation the device provides.
critical-section = ["corduroy-core/critical-section"]
# Add-ons: WebAssembly plugins, through wasmtime (`corduroy_harness::wasm`). Without it the
# harness runs extensions only and carries no WebAssembly runtime. Extensions themselves (the
# shell kernel, the file log, providers) are not the loop's: `corduroy-std` gathers them.
wasm = ["std", "dep:corduroy-wasm"]

[dependencies]
corduroy-core = { workspace = true }
corduroy-wasm = { workspace = true, optional = true }
base64 = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# Extensions the demo and the tests plug in: a shell kernel and a log in a file.
corduroy-jsonl = { workspace = true }
corduroy-shell = { workspace = true }
corduroy-test-support = { workspace = true }
tokio = { workspace = true }

# The demo and the tests that load add-ons.
[[example]]
name = "demo"
required-features = ["wasm"]

[[test]]
name = "addons"
required-features = ["wasm"]

[[test]]
name = "baseline"
required-features = ["wasm"]

[[test]]
name = "compaction"
required-features = ["wasm"]

[[test]]
name = "plugins"
required-features = ["wasm"]

[[test]]
name = "providers"
required-features = ["wasm"]

[[test]]
name = "review"
required-features = ["wasm"]

[[test]]
name = "subagents"
required-features = ["wasm"]

[[test]]
name = "viewer"
required-features = ["wasm"]

# A tool that blocks until it is stopped needs another thread to stop it from.
[[test]]
name = "stop"
required-features = ["tokio"]

# Plugins are compiled to machine code when they are loaded. With the compiler itself
# unoptimised that takes seconds per plugin and dominates test time, so the crates on that
# path are optimised even in debug builds.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wit-component]
opt-level = 3
[profile.dev.package.wit-parser]
opt-level = 3
[profile.dev.package.wasm-encoder]
opt-level = 3

# -----------------------------------------------------------------------------
# Lints
#
# Policy: as strict as Clippy gets. Everything is `warn` here so day-to-day
# `cargo check` stays quick; `cargo lint` (and CI) promote warnings to errors.
# Do not blanket-allow a lint. Where a single exception is justified, use
# `#[expect(lint, reason = "...")]` at the narrowest scope so it is removed
# automatically once it stops being needed.
# -----------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
redundant_imports = "warn"
explicit_outlives_requirements = "warn"
meta_variable_misuse = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
# Whole lint groups (lowest priority so the individual entries below win).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Hand-picked `restriction` lints. This group is never enabled wholesale because
# it contains contradictory lints; these are the ones that fit an agent harness.
# -- Failure handling: surface errors, never panic in library paths.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
exit = "warn"
# -- Output goes through the writer we are handed, not stray prints.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
use_debug = "warn"
# -- Explicitness.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
error_impl_error = "warn"
clone_on_ref_ptr = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_add = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
partial_pub_fields = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
renamed_function_params = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
