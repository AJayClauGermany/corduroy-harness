# Guest plugins. Each member compiles to a WebAssembly module that the host wraps into a
# component and loads as a capability-gated plugin:
#
#   cargo plugins        (from the repository root)
#
# This is a separate workspace from the host: it targets wasm32-unknown-unknown, and the
# bindings `wit-bindgen` generates need `unsafe`, which the host workspace forbids.
[workspace]
members = ["approval", "pi-tools", "skills"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSL-1.0"
repository = "https://github.com/AJayClauGermany/corduroy-harness"
publish = false

[workspace.dependencies]
wit-bindgen = "0.63.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A panic inside a plugin is a trap that takes the whole instance down.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
